name: build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC ≈ 7–8am Melbourne, every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cron / manual runs regenerate the data; plain pushes deploy as-is.
      - name: Refresh daily digest
        if: github.event_name != 'push'
        run: python3 scripts/digest.py

      # A failed sweep must not blank the metadata — repos.py exits non-zero
      # and leaves the previous data/repos.json standing.
      - name: Sweep repo metadata
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/repos.py

      - name: Rebuild the brain
        if: github.event_name != 'push'
        run: python3 scripts/brain.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "exaryn-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ brain/
          if git diff --cached --quiet; then
            echo "nothing changed, nothing to commit"
          else
            git commit -m "data: daily refresh — digest, repos, brain [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
